name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main, "release/v*"]
  pull_request:
    types: [ready_for_review, synchronize, opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      repository: ${{ steps.plan.outputs.repository }}
      lint: ${{ steps.plan.outputs.lint }}
      types: ${{ steps.plan.outputs.types }}
      i18n: ${{ steps.plan.outputs.i18n }}
      main: ${{ steps.plan.outputs.main }}
      renderer: ${{ steps.plan.outputs.renderer }}
      packages: ${{ steps.plan.outputs.packages }}
      platform: ${{ steps.plan.outputs.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Plan affected validation
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            node scripts/validation/run.mjs --committed --base HEAD^1 --github-output
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
              node scripts/validation/run.mjs --committed --base "$BEFORE_SHA" --github-output
            else
              node scripts/validation/run.mjs --all --github-output
            fi
          else
            node scripts/validation/run.mjs --all --github-output
          fi

      - name: "Validation scope: ${{ steps.plan.outputs.scope }}"
        run: ":"

  main-test-shard:
    name: main-test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.main == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
        id: dependencies
      - name: "Dependency cache: ${{ steps.dependencies.outputs.cache-state }}"
        run: ":"
      - run: pnpm check --group main --shard=${{ matrix.shard }}/3

  renderer-test-shard:
    name: renderer-test (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
        id: dependencies
      - name: "Dependency cache: ${{ steps.dependencies.outputs.cache-state }}"
        run: ":"
      - run: pnpm check --group renderer --shard=${{ matrix.shard }}/5

  package-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    env:
      VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-validation
        id: dependencies
      - name: "Dependency cache: ${{ steps.dependencies.outputs.cache-state }}"
        run: ":"
      - run: pnpm check --group packages
      - name: Check Web Search Package
        if: contains(fromJSON(needs.changes.outputs.plan).projects, 'web-search')
        run: pnpm --filter @cherrystudio/web-search test:package
      - name: Check Provider Registry Package
        if: contains(fromJSON(needs.changes.outputs.plan).projects, 'provider-registry')
        run: pnpm --filter @cherrystudio/provider-registry test:package

  platform-test:
    name: platform-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: macOS native build prerequisites
        if: runner.os == 'macOS'
        run: brew install python-setuptools
      - uses: ./.github/actions/setup-validation
        id: dependencies
      - name: "Dependency cache: ${{ steps.dependencies.outputs.cache-state }}"
        shell: bash
        run: ":"
      - name: Platform contracts
        env:
          VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
        run: pnpm check --group platform

  general-test:
    runs-on: ubuntu-latest
    needs: [changes, main-test-shard, package-test, platform-test]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify planned jobs
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: node scripts/validation/verify.mjs general

  render-test:
    runs-on: ubuntu-latest
    needs: [changes, renderer-test-shard]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify planned jobs
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: node scripts/validation/verify.mjs renderer
