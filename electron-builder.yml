appId: com.kangfenmao.CherryStudio
productName: Cherry Studio
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
  - ja # macOS/linux/win
  - ru # macOS/linux/win
  - zh_CN # for macOS
  - zh_TW # for macOS
  - en # for macOS
  - de
directories:
  buildResources: build

protocols:
  - name: Cherry Studio
    schemes:
      - cherrystudio
files:
  - "**/*"
  - "!**/{.vscode,.yarn,.yarn-lock,.github,.cursorrules,.prettierrc}"
  - "!electron.vite.config.{js,ts,mjs,cjs}}"
  - "!.*"
  - "!components.json"
  - "!**/{.eslintignore,.eslintrc.js,.eslintrc.json,.eslintcache,root.eslint.config.js,eslint.config.js,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md,biome.jsonc}"
  - "!**/{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!**/{tsconfig.json,tsconfig.tsbuildinfo,tsconfig.node.json,tsconfig.web.json}"
  - "!**/{.editorconfig,.jekyll-metadata}"
  - "!src"
  - "!src-tauri{,/**}"
  - "!config"
  - "!patches"
  - "!app-upgrade-config.json"
  - "!**/node_modules/**/*.cpp"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/prebuild-install/**"
  - "!scripts"
  - "!local"
  - "!docs"
  - "!packages"
  - "!.swc"
  - "!.bin"
  - "!._*"
  - "!*.log"
  - "!stats.html"
  - "!*.md"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/*.{map,ts,tsx,jsx,less,scss,sass,css.d.ts,d.cts,d.mts,md,markdown,yaml,yml}"
  - "!**/{test,tests,__tests__,powered-test,coverage}/**"
  - "!**/{example,examples}/**"
  - "!**/*.{spec,test}.{js,jsx,ts,tsx}"
  - "!**/*.min.*.map"
  - "!**/*.d.ts"
  - "!**/dist/es6/**"
  - "!**/dist/demo/**"
  - "!**/amd/**"
  - "!**/{.DS_Store,Thumbs.db,thumbs.db,__pycache__}"
  - "!**/{LICENSE,license,LICENSE.*,*.LICENSE.txt,NOTICE.txt,README.md,readme.md,CHANGELOG.md}"
  - "!node_modules/rollup-plugin-visualizer"
  - "!node_modules/js-tiktoken"
  - "!node_modules/@tavily/core/node_modules/js-tiktoken"
  - "!node_modules/pdf-parse/lib/pdf.js/{v1.9.426,v1.10.88,v2.0.550}"
  - "!node_modules/mammoth/{mammoth.browser.js,mammoth.browser.min.js}"
  - "!node_modules/selection-hook/prebuilds/**/*" # we rebuild .node, don't use prebuilds
  - "!node_modules/selection-hook/node_modules" # we don't need what in the node_modules dir
  - "!node_modules/selection-hook/src" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core.js,tesseract-core.wasm,tesseract-core.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-lstm.js,tesseract-core-lstm.wasm,tesseract-core-lstm.wasm.js}" # we don't need source files
  - "!node_modules/tesseract.js-core/{tesseract-core-simd-lstm.js,tesseract-core-simd-lstm.wasm,tesseract-core-simd-lstm.wasm.js}" # we don't need source files
  - "!**/*.{h,iobj,ipdb,tlog,recipe,vcxproj,vcxproj.filters,Makefile,*.Makefile}" # filter .node build files
  - "resources/**/*" # include all files in resources, and unpack them from asar for runtime access
asarUnpack:
  - out/proxy/**
  - resources/**
  - "**/*.{metal,exp,lib}"
  - "node_modules/@img/sharp-*/**"

win:
  executableName: Cherry Studio
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  target:
    - target: nsis
    - target: portable
  signtoolOptions:
    sign: scripts/win-sign.js
  verifyUpdateCodeSignature: false
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
  include: build/nsis-installer.nsh
  buildUniversalInstaller: false
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
  buildUniversalInstaller: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  target:
    - target: dmg
    - target: zip
dmg:
  writeUpdateInfo: false
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: CherryStudio
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: electronjs.org
  category: Utility
  desktop:
    entry:
      Name: Cherry Studio
      StartupWMClass: CherryStudio
  mimeTypes:
    - x-scheme-handler/cherrystudio
rpm:
  # Workaround for electron build issue on rpm package:
  # https://github.com/electron/forge/issues/3594
  fpm: ["--rpm-rpmbuild-define=_build_id_links none"]
publish:
  provider: generic
  url: https://releases.cherry-ai.com
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
beforePack: scripts/before-pack.js
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
artifactBuildCompleted: scripts/artifact-build-completed.js
releaseInfo:
  releaseNotes: |
    <!--LANG:en-->
    Cherry Studio 1.9.15 - New Models and Stability Fixes

    ✨ New Features
    - [Models] Added support for the Claude Fable series and Claude Opus 5
    - [Models] Added support for Kimi K2.7 Code
    - [Models] Added support for LongCat 2.0, with a thinking mode toggle
    - [Models] Added support for doubao-seed-2-1 and doubao-seed-evolving

    🐛 Bug Fixes
    - [Chat] Fixed tool results not being included in the model's context
    - [Chat] Fixed conversation compaction starting at the wrong point for the configured context window
    - [Chat] Fixed older messages being unreachable when the first page did not fill the window
    - [Chat] Fixed Mermaid flowchart errors when node labels contain Chinese, Japanese or Korean characters together with parentheses
    - [Chat] Replies that end abnormally or reach the length limit now show a clear message instead of stopping silently
    - [Models] Fixed deep thinking requests for Claude Opus 4.8
    - [Models] Fixed DeepSeek V4+ reasoning effort being ignored on custom OpenAI-compatible providers
    - [Models] The Anthropic "Fetch model list" button now returns the latest models instead of a fixed list
    - [Models] Fixed Qwen max models being incorrectly detected as vision capable
    - [Models] Fixed Gemini errors when continuing a conversation after an empty or interrupted reply
    - [Agents] Fixed the Agents page failing to load when agent or session data was damaged
    - [Agents] Agents now start even when one of the configured MCP servers cannot be reached
    - [Agents] Deleting a session now also removes its stored messages
    - [Knowledge] Fixed a crash when updating knowledge base content
    - [Copilot] Fixed GitHub Copilot sign-in when custom request headers are configured
    - [Search] Fixed search query rewriting
    - [OpenClaw] The dashboard access token is no longer placed in the page URL query string

    ⚡ Performance
    - [Windows] Disk space checks no longer leave powershell.exe processes behind, which previously piled up over time and consumed large amounts of memory
    - [Chat] Greatly reduced memory usage while streaming long code blocks, preventing out-of-memory crashes

    <!--LANG:zh-CN-->
    Cherry Studio 1.9.15 - 新模型支持与稳定性修复

    ✨ 新功能
    - [模型] 新增 Claude Fable 系列与 Claude Opus 5 支持
    - [模型] 新增 Kimi K2.7 Code 支持
    - [模型] 新增 LongCat 2.0 支持，可开关思考模式
    - [模型] 新增 doubao-seed-2-1 与 doubao-seed-evolving 支持

    🐛 问题修复
    - [对话] 修复工具调用结果未包含在模型上下文中的问题
    - [对话] 修复上下文压缩的触发时机与所配置上下文长度不一致的问题
    - [对话] 修复首屏消息未填满窗口时无法加载更早历史记录的问题
    - [对话] 修复 Mermaid 流程图节点标签同时包含中日韩字符与括号时的渲染错误
    - [对话] 回复异常结束或达到长度上限时，现在会给出明确提示而非静默中断
    - [模型] 修复 Claude Opus 4.8 深度思考请求异常的问题
    - [模型] 修复自定义 OpenAI 兼容提供商下 DeepSeek V4+ 推理强度失效的问题
    - [模型] Anthropic「获取模型列表」现在返回最新模型，不再使用固定列表
    - [模型] 修复 Qwen max 系列被误判为支持视觉的问题
    - [模型] 修复 Gemini 在空回复或中断回复后继续对话时报错的问题
    - [智能体] 修复智能体或会话数据损坏时智能体页面无法加载的问题
    - [智能体] 单个 MCP 服务器无法连接时，智能体现在仍可正常启动
    - [智能体] 删除会话时会一并清理其存储的消息
    - [知识库] 修复更新知识库内容时的崩溃问题
    - [Copilot] 修复配置自定义请求头时 GitHub Copilot 登录失败的问题
    - [搜索] 修复搜索查询改写失效的问题
    - [OpenClaw] 仪表盘访问令牌不再出现在页面 URL 查询参数中

    ⚡ 性能优化
    - [Windows] 磁盘空间检查不再残留 powershell.exe 进程，此前这些进程会持续累积并占用大量内存
    - [对话] 大幅降低流式输出长代码块时的内存占用，避免内存耗尽崩溃
    <!--LANG:END-->
